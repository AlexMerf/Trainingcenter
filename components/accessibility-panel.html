<section class="accessibilityPanel">
	<div class="accessibilityPanelTitle">
		<h3>Параметры доступности</h3>
		<button class="accessibilityPanelClose" aria-label="закрыть Параметры доступности"
			title="закрыть Параметры доступности">
			<div class="accessibilityPanelCloseIcon"></div>
		</button>
	</div>
	<div class="accessibilityPanelWrapper">
		<div class="accessibilityPanelWrapperBox disabledImage">
			<span class="accessibilityPanelWrapperBoxTitle">Изображения:</span>
			<div class="accessibilityPanelWrapperBoxTools">
				<button class="btnMain active small" id="showImg">показать</button>
				<button class="btnMain small" id="hidedImg">скрыть</button>
			</div>
		</div>
		<div class="accessibilityPanelWrapperBox latterSpacing">
			<span class="accessibilityPanelWrapperBoxTitle">Межбуквенное расстояние:</span>
			<div class="accessibilityPanelWrapperBoxTools">
				<button class="btnMain active small" id="letterSpacingDefault">рекомендуймый</button>
				<button class="btnMain small" id="letterSpacingLarge">большой</button>
				<button class="btnMain small" id="letterSpacingExtraLarge">очень большой</button>
			</div>
		</div>
		<div class="accessibilityPanelWrapperBox fontStyles">
			<span class="accessibilityPanelWrapperBoxTitle">Размер шрифта:</span>
			<div class="accessibilityPanelWrapperBoxTools">
				<button class="btnMain active small" id="fontSizeDefault">рекомендуймый</button>
				<button class="btnMain small" id="fontSizeLarge">большой</button>
				<button class="btnMain small" id="fontSizeExtraLarge">очень большой</button>
			</div>
		</div>
		<div class="accessibilityPanelWrapperBox colorSheme">
			<span class="accessibilityPanelWrapperBoxTitle">Цветовая схема:</span>
			<div class="accessibilityPanelWrapperBoxTools">
				<button class="btnMain active small" id="colorSchemeDefault">обычная</button>
				<button class="btnMain small" id="colorSchemeContract">контрастная</button>
				<button class="btnMain small" id="colorSchemeInversion">инверсия</button>
			</div>
		</div>
	</div>
</section>
